name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p fidel-core --all-targets -- -D warnings
      - run: cargo test -p fidel-core
