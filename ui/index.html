<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethiopic Font Editor</title>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-start" data-tauri-drag-region>
        <div class="menu-wrap">
          <button id="app-menu-btn" class="app-menu-btn" aria-label="Main menu" aria-haspopup="menu" aria-expanded="false">
            <span class="app-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="16" height="16">
                <path d="M7 7h15M7 7v18M19 7v13" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none" />
                <circle cx="22.5" cy="22.5" r="3.6" stroke="currentColor" stroke-width="2.8" fill="none" />
              </svg>
            </span>
            <svg class="caret" viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <div id="app-menu" class="menu" role="menu" aria-label="Main menu" hidden>
            <div class="menu-label">File</div>
            <button class="menu-item" role="menuitem" data-file="new">New project<kbd>Ctrl N</kbd></button>
            <button class="menu-item" role="menuitem" data-file="open">Open…<kbd>Ctrl O</kbd></button>
            <button class="menu-item" role="menuitem" data-file="save">Save<kbd>Ctrl S</kbd></button>
            <button class="menu-item" role="menuitem" data-file="saveas">Save as…<kbd>Ctrl Shift S</kbd></button>
            <button class="menu-item" role="menuitem" data-menu="export">Export font…<kbd>Ctrl E</kbd></button>
            <div class="menu-sep" role="separator"></div>
            <div class="menu-label">View</div>
            <button class="menu-item" role="menuitem" data-menu="view-grid">Fidel grid<kbd>1</kbd></button>
            <button class="menu-item" role="menuitem" data-menu="view-editor">Glyph editor<kbd>2</kbd></button>
            <button class="menu-item" role="menuitem" data-menu="toggle-left">Show or hide sidebars<kbd>Ctrl \</kbd></button>
            <div class="menu-sep" role="separator"></div>
            <div class="menu-label">Appearance</div>
            <button class="menu-item radio" role="menuitemradio" data-theme-choice="system" aria-checked="true">Match system</button>
            <button class="menu-item radio" role="menuitemradio" data-theme-choice="light" aria-checked="false">Light</button>
            <button class="menu-item radio" role="menuitemradio" data-theme-choice="dark" aria-checked="false">Dark</button>
          </div>
        </div>

        <nav class="tabs" aria-label="Views">
          <button class="tab active" data-view="grid">Grid</button>
          <button class="tab" data-view="editor">Editor</button>
        </nav>
      </div>

      <div class="titlebar-center" data-tauri-drag-region>
        <span id="project-name" class="project-name" data-tauri-drag-region>Untitled Ge'ez</span>
        <span class="title-sep" data-tauri-drag-region>/</span>
        <span id="project-meta" class="project-meta" data-tauri-drag-region>Regular · 1000 UPM</span>
      </div>

      <div class="titlebar-end" data-tauri-drag-region>
        <span id="core-status" class="status" title="Core"><span class="dot"></span><span class="label">Connecting…</span></span>
        <button id="export-font" class="btn btn-accent" title="Export an installable font of everything drawn so far (Ctrl+E)">Export</button>
        <div id="window-controls" class="window-controls" role="group" aria-label="Window">
          <button class="win-btn" data-win="minimize" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
          </button>
          <button class="win-btn" data-win="maximize" title="Maximize" aria-label="Maximize">
            <svg class="icon-max" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2" stroke="currentColor" stroke-width="1.2" fill="none" /></svg>
            <svg class="icon-restore" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="3.8" width="6.2" height="6.2" rx="1.2" stroke="currentColor" stroke-width="1.2" fill="none" /><path d="M4 2.2h4.4a1.6 1.6 0 0 1 1.6 1.6V8" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" /></svg>
          </button>
          <button class="win-btn win-close" data-win="close" title="Close" aria-label="Close">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside id="sidebar" class="sidebar sidebar-left" aria-label="Glyphs and parts">
        <div class="side-tabs" role="tablist">
          <button class="side-tab active" role="tab" aria-selected="true" data-side="glyphs">Glyphs</button>
          <button class="side-tab" role="tab" aria-selected="false" data-side="parts">Parts</button>
        </div>
        <label class="search">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none" /><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
          <input id="side-search" type="search" placeholder="Find a fidel, family or U+ code" aria-label="Find" spellcheck="false" />
        </label>
        <div id="side-list" class="side-list" role="tree"></div>
      </aside>

      <section class="stage">
        <div id="grid-view" class="view grid-view">
          <div class="stage-bar">
            <div class="stage-title">
              <h1 class="stage-heading">Fidel grid</h1>
              <span id="grid-summary" class="subtle">Loading the system…</span>
            </div>
            <div id="filters" class="filters" role="group" aria-label="Filter by state"></div>
          </div>
          <div id="grid" class="grid-scroll"></div>

          <div class="proof">
            <span class="proof-label">Proof</span>
            <input
              id="proof-input"
              class="proof-input"
              lang="am"
              spellcheck="false"
              aria-label="Proof text"
              value="ሰላም ለዓለም። ዛሬ ቤቴ ሄጄ ሻይ ጠጣሁ።"
            />
            <span id="proof-note" class="proof-note">System font until you draw</span>
          </div>
        </div>

        <div id="editor-view" class="view editor-view" hidden>
          <div class="stage-bar">
            <div class="stage-title">
              <h1 class="stage-heading editor-title">Editor</h1>
              <span class="subtle editor-subtitle"></span>
            </div>
            <label class="select-field">
              <span class="select-label">Drawing</span>
              <select id="drawing-select" aria-label="Drawing to edit"></select>
            </label>
          </div>

          <div class="canvas-wrap">
            <svg class="canvas" data-tool="select" role="img" aria-label="Glyph canvas"></svg>

            <div class="dock" role="toolbar" aria-label="Tools">
              <button class="tool active" data-tool="select" title="Move (V)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 3l10 6.5-4.5 1L13 16l-2 1-2.5-5.5L5 15z" fill="currentColor"/></svg>
              </button>
              <button class="tool" data-tool="pen" title="Pen (P)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 2l5 8-3 6H8l-3-6zM10 2v7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/></svg>
              </button>
              <button class="tool" data-tool="hand" title="Hand (H, or hold Space)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M7 10V4.5a1.2 1.2 0 012.4 0V9m0-5.5a1.2 1.2 0 012.4 0V9m0-4a1.2 1.2 0 012.4 0V10m0-3a1.2 1.2 0 012.4 0v5c0 3-2 5-5 5h-1c-2 0-3-1-4-2.5L3.5 11a1.2 1.2 0 012-1.3L7 11.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="dock-sep"></span>
              <button class="tool" data-action="undo" title="Undo (Ctrl+Z)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M8 5L4 9l4 4M4 9h7a5 5 0 010 10H9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="tool" data-action="redo" title="Redo (Ctrl+Shift+Z)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5l4 4-4 4M16 9H9a5 5 0 000 10h2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="dock-sep"></span>
              <button class="tool text" data-action="import-svg" title="Import an SVG file, or paste SVG with Ctrl+V">Import SVG</button>
              <input class="svg-file" type="file" accept=".svg,image/svg+xml" hidden />
            </div>

            <div class="zoom-box">
              <button class="tool" data-action="zoom-out" title="Zoom out (−)">−</button>
              <span class="zoom-label">100%</span>
              <button class="tool" data-action="zoom-in" title="Zoom in (+)">+</button>
              <button class="tool text" data-action="fit" title="Fit (0)">Fit</button>
            </div>

            <span class="coords" aria-live="off"></span>
          </div>
        </div>
      </section>

      <aside id="inspector" class="sidebar sidebar-right inspector" aria-live="polite"></aside>
    </main>

    <div id="toasts" class="toasts" aria-live="assertive"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
