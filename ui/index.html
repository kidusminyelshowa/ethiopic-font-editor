<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethiopic Font Editor</title>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-pink"></span>
      <span class="blob blob-green"></span>
      <span class="blob blob-orange"></span>
    </div>

    <header class="toolbar glass">
      <div class="brand">
        <span class="app-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20">
            <path d="M7 7h15M7 7v18M19 7v13" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none" />
            <circle cx="22.5" cy="22.5" r="3.6" stroke="currentColor" stroke-width="2.6" fill="none" />
          </svg>
        </span>
        <div class="brand-text">
          <span id="project-name" class="project-name">Untitled Ge'ez</span>
          <span id="project-meta" class="project-meta">Regular · 1000 UPM</span>
        </div>
      </div>

      <nav class="tabs" aria-label="Views">
        <button class="tab active" data-view="grid">Grid</button>
        <button class="tab" data-view="editor">Editor</button>
        <button class="tab" disabled title="Family view is coming in M1">Family</button>
        <button class="tab" disabled title="Proof view is coming later">Proof</button>
      </nav>

      <div class="toolbar-end">
        <span id="core-status" class="chip status"><span class="dot"></span><span class="label">Connecting…</span></span>
        <div class="file-actions" role="group" aria-label="File">
          <button class="file-btn" data-file="new" title="New project (Ctrl+N)">New</button>
          <button class="file-btn" data-file="open" title="Open a .kid file (Ctrl+O)">Open</button>
          <button class="file-btn" data-file="save" title="Save (Ctrl+S). Shift-click to save as.">Save</button>
        </div>
        <button id="export-font" class="pill pill-accent" title="Export an installable font of everything drawn so far (Ctrl+E)">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path d="M10 3v10m0 0-4-4m4 4 4-4M4 16h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
          Export font
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="card main-card">
        <div id="grid-view" class="view grid-view">
          <div class="card-head">
            <div>
              <h1 class="display">Fidel Grid</h1>
              <p id="grid-summary" class="subtle">Loading the system…</p>
            </div>
            <div id="filters" class="filters" role="group" aria-label="Filter by state"></div>
          </div>
          <div id="grid" class="grid-scroll"></div>

          <div class="proof glass">
            <span class="proof-label">Proof</span>
            <input
              id="proof-input"
              class="proof-input"
              lang="am"
              spellcheck="false"
              aria-label="Proof text"
              value="ሰላም ለዓለም። ዛሬ ቤቴ ሄጄ ሻይ ጠጣሁ።"
            />
            <span id="proof-note" class="proof-note">System font until you draw</span>
          </div>
        </div>

        <div id="editor-view" class="view editor-view" hidden>
          <div class="card-head editor-head">
            <div class="editor-heading">
              <h1 class="display editor-title">Editor</h1>
              <p class="subtle editor-subtitle"></p>
            </div>
            <label class="pill-select">
              <span class="pill-select-label">Drawing</span>
              <select id="drawing-select" aria-label="Drawing to edit"></select>
            </label>
          </div>

          <div class="canvas-wrap">
            <svg class="canvas" data-tool="select" role="img" aria-label="Glyph canvas"></svg>

            <div class="tool-palette glass" role="toolbar" aria-label="Tools">
              <button class="tool active" data-tool="select" title="Select (V)">
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 3l10 6.5-4.5 1L13 16l-2 1-2.5-5.5L5 15z" fill="currentColor"/></svg>
              </button>
              <button class="tool" data-tool="pen" title="Pen (P)">
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2l5 8-3 6H8l-3-6zM10 2v7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/></svg>
              </button>
              <button class="tool" data-tool="hand" title="Hand (H, or hold Space)">
                <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7 10V4.5a1.2 1.2 0 012.4 0V9m0-5.5a1.2 1.2 0 012.4 0V9m0-4a1.2 1.2 0 012.4 0V10m0-3a1.2 1.2 0 012.4 0v5c0 3-2 5-5 5h-1c-2 0-3-1-4-2.5L3.5 11a1.2 1.2 0 012-1.3L7 11.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>

            <div class="canvas-bar glass">
              <button class="icon-btn" data-action="zoom-out" title="Zoom out (−)">−</button>
              <span class="zoom-label">100%</span>
              <button class="icon-btn" data-action="zoom-in" title="Zoom in (+)">+</button>
              <button class="bar-btn" data-action="fit" title="Fit (0)">Fit</button>
              <span class="bar-sep"></span>
              <button class="icon-btn" data-action="undo" title="Undo (Ctrl+Z)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M8 5L4 9l4 4M4 9h7a5 5 0 010 10H9" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-btn" data-action="redo" title="Redo (Ctrl+Shift+Z)">
                <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5l4 4-4 4M16 9H9a5 5 0 000 10h2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <span class="bar-sep"></span>
              <button class="bar-btn" data-action="import-svg" title="Import an SVG file, or paste SVG with Ctrl+V">Import SVG</button>
              <input class="svg-file" type="file" accept=".svg,image/svg+xml" hidden />
            </div>

            <span class="coords chip" aria-live="off"></span>
          </div>
        </div>
      </section>

      <aside id="inspector" class="inspector glass" aria-live="polite"></aside>
    </main>

    <div id="toasts" class="toasts" aria-live="assertive"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
